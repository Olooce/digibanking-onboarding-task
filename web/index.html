<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiBank - Bulk Onboarding Console</title>
    <meta name="description" content="Staff console for bulk digital banking onboarding.">
    <link rel="preload" href="./fonts/lato/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/tokens.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <script type="module" src="./assets/js/main.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="m3 8 4-4 4 4M7 4v16M21 16l-4 4-4-4M17 20V4"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-first" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-last" viewBox="0 0 24 24"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-kebab" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-checkCircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-xCircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-wifiOff" viewBox="0 0 24 24"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 12.86a10 10 0 0 1 5.17-2.69M2 2l20 20"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M8 13h2M14 13h2M8 17h2M14 17h2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
    <symbol id="i-arrowLeft" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-shieldCheck" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>

</svg>

<a class="skip-link" href="#main" data-skip-link>Skip to main content</a>

<div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Primary">
        <a class="brand" href="#/batches" aria-label="DigiBank onboarding console, home" data-label="DigiBank onboarding console">
            <span class="brand__mark" aria-hidden="true">DB</span>
            <span class="brand__text">
                <span class="brand__name">DigiBank</span>
                <span class="brand__sub">Bulk Onboarding Console</span>
            </span>
        </a>

        <div class="sidebar__cta">
            <a class="btn btn--primary" href="#/batches/new" data-label="New batch">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
                <span class="sidebar__cta-label">New batch</span>
            </a>
        </div>

        <p class="nav-section" id="nav-workspace">Workspace</p>
        <ul aria-labelledby="nav-workspace">
            <li>
                <a class="nav-item" href="#/batches" data-nav="batches" data-label="Upload batches">
                    <svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>
                    <span class="nav-item__label">Upload batches</span>
                    <span class="nav-item__count" hidden></span>
                </a>
            </li>
            <li>
                <a class="nav-item" href="#/members" data-nav="members" data-label="Onboarded members">
                    <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>
                    <span class="nav-item__label">Onboarded members</span>
                    <span class="nav-item__count" hidden></span>
                </a>
            </li>
            <li>
                <a class="nav-item" href="#/template" data-nav="template" data-label="Workbook template">
                    <svg class="icon" aria-hidden="true"><use href="#i-sheet"/></svg>
                    <span class="nav-item__label">Workbook template</span>
                    <span class="nav-item__count" hidden></span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="nav-backdrop" aria-hidden="true"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn nav-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar">
                <svg class="icon icon--lg" aria-hidden="true"><use href="#i-menu"/></svg>
            </button>
            <nav class="breadcrumb grow" aria-label="Breadcrumb">
                <ol></ol>
            </nav>
            <form class="topbar__search" role="search" action="#/batches">
                <div class="input-icon">
                    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                    <input class="input" type="search" name="q" placeholder="Find a batch by name" aria-label="Find a batch by name" aria-keyshortcuts="/">
                </div>
            </form>
            <span class="badge badge--warning" title="Training environment. No real bank is contacted.">Training simulator</span>
        </header>

        <main class="content" id="main" tabindex="-1">
            <noscript>This console requires JavaScript.</noscript>
        </main>
    </div>
</div>

<div class="toasts" aria-live="polite" aria-relevant="additions"></div>

<template id="tpl-pending">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1 data-slot="title"></h1></div>
            <p class="page-header__sub" data-slot="subtitle"></p>
        </div>
    </div>
    <div class="state">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
        <p class="state__title">This view is not built yet.</p>
    </div>
</template>

<template id="tpl-not-found">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1>Page not found</h1></div>
        </div>
    </div>
    <div class="state">
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <p class="state__title">There is nothing at this address.</p>
        <div class="cluster"><a class="btn btn--secondary" href="#/batches">Go to upload batches</a></div>
    </div>
</template>

<template id="tpl-toast">
    <div class="alert toast">
        <svg class="icon" aria-hidden="true"><use data-slot="icon"/></svg>
        <div class="alert__body">
            <p class="alert__title" data-slot="title"></p>
            <p data-slot="message"></p>
        </div>
        <button class="icon-btn" type="button" aria-label="Dismiss notification" data-action="dismiss">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
    </div>
</template>
</body>
</html>
