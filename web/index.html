<div aria-live="polite" aria-relevant="additions" class="toasts"></div>

<template id="tpl-batches">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1>Upload batches</h1></div>
            <p class="page-header__sub">Spreadsheet batches submitted for digital banking enrolment. Validation never
                onboards members; only a commit does.</p>
        </div>
        <div class="page-header__actions">
            <a class="btn btn--primary" href="#/batches/new">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-plus"/>
                </svg>
                New batch
            </a>
        </div>
    </div>
    <section aria-label="Upload batches" class="card card--fill" data-slot="panel">
        <div aria-label="Filter batches by stage" class="tabs" role="tablist">
            <button aria-controls="batches-table" class="tab" data-tab="all" role="tab" type="button">All <span
                    class="tab__count" hidden></span></button>
            <button aria-controls="batches-table" class="tab" data-tab="review" role="tab" type="button">Needs review
                <span class="tab__count" hidden></span></button>
            <button aria-controls="batches-table" class="tab" data-tab="progress" role="tab" type="button">In progress
                <span class="tab__count" hidden></span></button>
            <button aria-controls="batches-table" class="tab" data-tab="committed" role="tab" type="button">Committed
                <span class="tab__count" hidden></span></button>
            <button aria-controls="batches-table" class="tab" data-tab="failed" role="tab" type="button">Failed <span
                    class="tab__count" hidden></span></button>
            <button aria-label="Refresh" class="icon-btn tabs__aside" data-slot="refresh" title="Refresh" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-refresh"/>
                </svg>
            </button>
        </div>
        <div data-slot="table" id="batches-table" role="tabpanel"></div>
    </section>
</template>

<template id="tpl-new-batch">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1 data-slot="title">New batch</h1></div>
            <p class="page-header__sub" data-slot="subtitle">Name the batch, then upload the completed workbook.
                Validation checks every row; nothing is onboarded until you commit.</p>
        </div>
        <div class="page-header__actions">
            <button class="btn btn--secondary" data-slot="template" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-download"/>
                </svg>
                Download template
            </button>
        </div>
    </div>
    <div class="split split--wide">
        <form aria-labelledby="new-batch-details" class="card" data-slot="form" novalidate>
            <div class="card__header"><h2 id="new-batch-details">Batch details</h2></div>
            <div class="card__body">
                <div data-slot="fields"></div>
                <div class="cluster form-actions">
                    <button class="btn btn--primary" data-slot="submit" type="submit">
                        <svg aria-hidden="true" class="icon">
                            <use href="#i-upload"/>
                        </svg>
                        <span data-slot="submit-label">Upload and validate</span>
                    </button>
                    <a class="btn btn--ghost" href="#/batches">Back to batches</a>
                </div>
            </div>
        </form>

        <section aria-labelledby="new-batch-progress" class="card">
            <div class="card__header">
                <h2 class="grow" id="new-batch-progress">Progress</h2>
                <span class="badge" data-slot="connection" hidden></span>
            </div>
            <div class="card__body stack">
                <ol class="stepper">
                    <li class="stepper__item" data-step="upload">Upload</li>
                    <li class="stepper__item" data-step="verify">Verify</li>
                    <li class="stepper__item" data-step="validate">Validate</li>
                </ol>
                <div class="alert" data-slot="notice" hidden role="status">
                    <svg aria-hidden="true" class="icon">
                        <use data-slot="notice-icon"/>
                    </svg>
                    <div class="alert__body">
                        <p class="alert__title" data-slot="notice-title"></p>
                        <p data-slot="notice-text"></p>
                        <ul class="notice-list" data-slot="notice-list" hidden></ul>
                        <div class="alert__actions">
                            <a class="btn btn--primary btn--sm" data-slot="review" hidden>Review results</a>
                            <a class="btn btn--secondary btn--sm" data-slot="restart" hidden href="#/batches/new">Start
                                a new batch</a>
                        </div>
                    </div>
                </div>
                <div class="meter">
                    <div class="meter__head"><span>Upload</span><span class="num"
                                                                      data-slot="upload-text">Not started</span></div>
                    <div aria-label="Upload progress" aria-valuemax="100" aria-valuemin="0" aria-valuenow="0"
                         class="progress" data-slot="upload-bar" role="progressbar">
                        <div class="progress__bar"></div>
                    </div>
                </div>
                <div class="meter">
                    <div class="meter__head"><span>Validation</span><span class="num" data-slot="validate-text">Not started</span>
                    </div>
                    <div aria-label="Validation progress" aria-valuemax="100" aria-valuemin="0"
                         aria-valuenow="0" class="progress progress--info" data-slot="validate-bar" role="progressbar">
                        <div class="progress__bar"></div>
                    </div>
                </div>
                <dl class="tally">
                    <div class="tally__item tally__item--success">
                        <dt>Valid</dt>
                        <dd class="num" data-slot="count-valid">0</dd>
                    </div>
                    <div class="tally__item tally__item--danger">
                        <dt>Invalid</dt>
                        <dd class="num" data-slot="count-invalid">0</dd>
                    </div>
                    <div class="tally__item tally__item--warning">
                        <dt>Duplicate</dt>
                        <dd class="num" data-slot="count-duplicate">0</dd>
                    </div>
                </dl>
                <div>
                    <h3 class="overline">Activity</h3>
                    <ol aria-label="Activity" class="timeline" data-slot="log"></ol>
                </div>
            </div>
        </section>
    </div>
</template>

<template id="tpl-template">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1>Workbook template</h1></div>
            <p class="page-header__sub">The blank XLSX workbook that every batch must use.</p>
        </div>
        <div class="page-header__actions">
            <button class="btn btn--primary" data-slot="download" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-download"/>
                </svg>
                Download template
            </button>
        </div>
    </div>
    <section aria-labelledby="template-columns" class="card">
        <div class="card__header"><h2 id="template-columns">Columns</h2></div>
        <div class="card__body">
            <dl class="dl">
                <dt>first_name, last_name</dt>
                <dd>Required.</dd>
                <dt>date_of_birth</dt>
                <dd>Required, as YYYY-MM-DD.</dd>
                <dt>email</dt>
                <dd>Required.</dd>
                <dt>branch</dt>
                <dd>Required.</dd>
                <dt>account_type</dt>
                <dd>Required, for example personal or business.</dd>
                <dt>member_number, phone_number, id_number</dt>
                <dd>At least one is required. It is used to find the member in core banking.</dd>
            </dl>
        </div>
    </section>
</template>

<template id="tpl-batch">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1 data-slot="name"></h1><span data-slot="status"></span></div>
            <p class="page-header__sub" data-slot="description"></p>
        </div>
        <div class="page-header__actions">
            <button class="btn btn--secondary" data-slot="rejected" hidden type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-download"/>
                </svg>
                Rejected rows (.xlsx)
            </button>
            <span class="muted export-hint" data-slot="export-hint">Choose a status tab to export</span>
            <button class="btn btn--secondary" data-slot="export-csv" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-download"/>
                </svg>
                Export CSV
            </button>
            <button class="btn btn--secondary" data-slot="export-xlsx" type="button">
                <svg aria-hidden="true" class="icon">
                    <use href="#i-sheet"/>
                </svg>
                Export Excel
            </button>
        </div>
    </div>

    <dl class="meta-strip" data-slot="meta"></dl>

    <div class="alert" data-slot="notice" hidden role="status">
        <svg aria-hidden="true" class="icon">
            <use data-slot="notice-icon"/>
        </svg>
        <div class="alert__body">
            <p class="alert__title" data-slot="notice-title"></p>
            <p data-slot="notice-text"></p>
            <div class="alert__actions"><a class="btn btn--secondary btn--sm" data-slot="notice-link" hidden></a></div>
        </div>
    </div>

    <div class="review">
        <dl class="tally tally--four">
            <div class="tally__item tally__item--success">
                <dt>Valid</dt>
                <dd class="num" data-slot="count-valid">0</dd>
            </div>
            <div class="tally__item tally__item--danger">
                <dt>Invalid</dt>
                <dd class="num" data-slot="count-invalid">0</dd>
            </div>
            <div class="tally__item tally__item--warning">
                <dt>Duplicate</dt>
                <dd class="num" data-slot="count-duplicate">0</dd>
            </div>
            <div class="tally__item">
                <dt>Onboarded</dt>
                <dd class="num" data-slot="count-onboarded">0</dd>
            </div>
        </dl>
        <form aria-labelledby="commit-title" class="card commit" data-slot="commit" hidden novalidate>
            <div class="card__body stack">
                <h2 id="commit-title">Commit valid rows</h2>
                <div data-slot="commit-fields"></div>
                <div class="cluster">
                    <button class="btn btn--primary" data-slot="commit-button" type="submit">
                        <svg aria-hidden="true" class="icon">
                            <use href="#i-shieldCheck"/>
                        </svg>
                        <span data-slot="commit-label">Commit valid rows</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <section aria-label="Batch records" class="card card--fill">
        <div aria-label="Filter records by status" class="tabs" role="tablist">
            <button aria-controls="batch-records" class="tab" data-tab="all" role="tab" type="button">All <span
                    class="tab__count" hidden></span></button>
            <button aria-controls="batch-records" class="tab" data-tab="valid" role="tab" type="button">Valid <span
                    class="tab__count" hidden></span></button>
            <button aria-controls="batch-records" class="tab" data-tab="invalid" role="tab" type="button">Invalid <span
                    class="tab__count" hidden></span></button>
            <button aria-controls="batch-records" class="tab" data-tab="duplicate" role="tab" type="button">Duplicate
                <span class="tab__count" hidden></span></button>
            <button aria-controls="batch-records" class="tab" data-tab="onboarded" role="tab" type="button">Onboarded
                <span class="tab__count" hidden></span></button>
        </div>
        <div data-slot="table" id="batch-records" role="tabpanel"></div>
    </section>
</template>

<template id="tpl-members">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1>Onboarded members</h1></div>
            <p class="page-header__sub">Members whose onboarding the API has confirmed. Rows from a batch appear here
                only after it is committed.</p>
        </div>
    </div>
    <section aria-label="Onboarded members" class="card card--fill">
        <div data-slot="table"></div>
    </section>
</template>

<template id="tpl-member">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1 data-slot="name"></h1><span
                    class="badge badge--success-solid">Onboarded</span></div>
            <p class="page-header__sub"><span data-slot="onboarded"></span> from <a data-slot="batch">its batch</a></p>
        </div>
    </div>
    <div class="split split--wide">
        <section aria-labelledby="member-details-title" class="card">
            <div class="card__header"><h2 id="member-details-title">Member details</h2></div>
            <div class="card__body">
                <dl class="dl" data-slot="details"></dl>
            </div>
        </section>
        <section aria-labelledby="member-core-title" class="card">
            <div class="card__header"><h2 id="member-core-title">Core banking</h2></div>
            <div class="card__body stack">
                <p class="muted">Look the member up in core banking by member number and compare the details.</p>
                <div class="cluster">
                    <button class="btn btn--secondary" data-slot="check" type="button">
                        <svg aria-hidden="true" class="icon">
                            <use href="#i-shieldCheck"/>
                        </svg>
                        Check against core banking
                    </button>
                </div>
                <div data-slot="result"></div>
            </div>
        </section>
    </div>
</template>

<template id="tpl-load-error">
    <div class="state state--error" role="alert">
        <svg aria-hidden="true" class="icon">
            <use href="#i-alert"/>
        </svg>
        <p class="state__title" data-slot="title"></p>
        <p data-slot="message"></p>
        <div class="cluster"><a class="btn btn--secondary" href="#/batches">Go to upload batches</a></div>
    </div>
</template>

<template id="tpl-not-found">
    <div class="page-header">
        <div class="page-header__titles">
            <div class="page-header__title"><h1>Page not found</h1></div>
        </div>
    </div>
    <div class="state">
        <svg aria-hidden="true" class="icon">
            <use href="#i-alert"/>
        </svg>
        <p class="state__title">There is nothing at this address.</p>
        <div class="cluster"><a class="btn btn--secondary" href="#/batches">Go to upload batches</a></div>
    </div>
</template>

<template id="tpl-toast">
    <div class="alert toast">
        <svg aria-hidden="true" class="icon">
            <use data-slot="icon"/>
        </svg>
        <div class="alert__body">
            <p class="alert__title" data-slot="title"></p>
            <p data-slot="message"></p>
        </div>
        <button aria-label="Dismiss notification" class="icon-btn" data-action="dismiss" type="button">
            <svg aria-hidden="true" class="icon">
                <use href="#i-x"/>
            </svg>
        </button>
    </div>
</template>
</body>
</html>
